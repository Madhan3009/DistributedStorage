<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Storage Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        /* --- Auth Screen --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            z-index: 1000;
            background-image: inherit;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            color: var(--text-muted);
            font-weight: 500;
            transition: 0.3s;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-danger {
            background: var(--danger);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            box-shadow: none;
            width: auto;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        /* --- Dashboard Layout --- */
        #dashboard {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .main-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            .main-content { grid-template-columns: 2fr 1fr; }
            .full-width { grid-column: span 2; }
        }

        .card {
            padding: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Node Topology --- */
        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .node-card {
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: 0.2s;
        }
        .node-card:hover { border-color: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-badge.alive { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.dead { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        
        .pulse-dot {
            width: 6px; height: 6px; border-radius: 50%;
        }
        .alive .pulse-dot { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
        .dead .pulse-dot { background: var(--danger); }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 8px;
            border-radius: 4px;
            margin: 0.5rem 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* --- File Table --- */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 600; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .file-status {
            font-size: 0.8rem; font-weight: 500; padding: 0.2rem 0.5rem; border-radius: 4px;
        }
        .file-status.complete { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .file-status.pending { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

        /* --- Upload Zone --- */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255, 255, 255, 0.01);
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }
        .upload-zone i { font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem; }

        #upload-progress-container { display: none; margin-top: 1.5rem; }

        /* --- Toasts --- */
        #toast-container {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;
            display: flex; flex-direction: column; gap: 0.75rem;
        }
        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            display: flex; align-items: center; gap: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="auth-card glass">
            <div class="auth-title">
                <i class="fa-solid fa-server"></i> D-Store Console
            </div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')" id="tab-login">Login</div>
                <div class="auth-tab" onclick="switchTab('register')" id="tab-register">Register</div>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group" id="group-username">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="form-group" id="group-email" style="display: none;">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn" id="auth-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <header>
            <div class="logo">
                <i class="fa-solid fa-server"></i> D-Store Console
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span id="user-display" style="font-size: 0.9rem; font-weight: 500;"></span>
                <button class="btn btn-outline" style="padding: 0.5rem 1rem;" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </header>

        <main class="main-content">
            
            <!-- Topology -->
            <div class="card glass full-width">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-network-wired" style="color: var(--primary);"></i> Cluster Topology
                    </div>
                </div>
                <div class="node-grid" id="nodes-container">
                    <div style="color: var(--text-muted);">Loading nodes...</div>
                </div>
            </div>

            <!-- Files -->
            <div class="card glass">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-file-shield" style="color: var(--success);"></i> Storage Index
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Size</th>
                                <th>Chunks</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="files-container">
                            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading files...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Upload -->
            <div class="card glass">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-cloud-arrow-up" style="color: var(--primary);"></i> Upload File
                    </div>
                </div>
                
                <div class="upload-zone" id="dropzone" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-file-import"></i>
                    <h3 style="margin-bottom: 0.5rem; font-weight: 500;">Click or Drag & Drop</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Files will be chunked (50KB) and distributed</p>
                </div>
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">

                <div id="upload-progress-container">
                    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem;">
                        <span id="upload-filename">Uploading...</span>
                        <span id="upload-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="upload-fill" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- TOASTS -->
    <div id="toast-container"></div>

    <script>
        const CHUNK_SIZE = 1024 * 50; // 50 KB
        let isLogin = true;
        let refreshInterval = null;

        // --- Init ---
        window.onload = () => {
            if (getToken()) {
                showDashboard();
            } else {
                showAuth();
            }
        };

        // --- Auth Logic ---
        function switchTab(tab) {
            isLogin = tab === 'login';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-register').classList.toggle('active', !isLogin);
            
            document.getElementById('group-email').style.display = isLogin ? 'none' : 'block';
            document.getElementById('email').required = !isLogin;
            
            document.getElementById('auth-btn').innerText = isLogin ? 'Sign In' : 'Sign Up';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            const url = isLogin ? '/auth/login' : '/auth/register';
            const payload = isLogin ? { username, password } : { username, email, password };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(isLogin ? "Invalid credentials" : "Registration failed");

                if (!isLogin) {
                    showToast("Registration successful! Please log in.", "success");
                    switchTab('login');
                    document.getElementById('password').value = '';
                } else {
                    const data = await res.json();
                    localStorage.setItem('jwt_token', data.token);
                    localStorage.setItem('username', data.username);
                    showToast("Logged in successfully", "success");
                    showDashboard();
                }
            } catch (err) {
                showToast(err.message, "error");
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('username');
            showAuth();
            showToast("Logged out", "success");
        }

        // --- UI State ---
        function showAuth() {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            if (refreshInterval) clearInterval(refreshInterval);
        }

        function showDashboard() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('user-display').innerText = localStorage.getItem('username');
            
            fetchData();
            refreshInterval = setInterval(fetchData, 5000);
        }

        function getToken() {
            return localStorage.getItem('jwt_token');
        }

        function getAuthHeaders() {
            return { 'Authorization': `Bearer ${getToken()}` };
        }

        // --- Data Fetching ---
        function fetchData() {
            fetchNodes();
            fetchFiles();
        }

        async function fetchNodes() {
            try {
                const res = await fetch('/nodes', { headers: getAuthHeaders() });
                if (res.status === 401 || res.status === 403) return logout();
                const nodes = await res.json();
                renderNodes(nodes);
            } catch (e) {
                console.error("Failed to fetch nodes", e);
            }
        }

        async function fetchFiles() {
            try {
                const res = await fetch('/files', { headers: getAuthHeaders() });
                if (res.status === 401 || res.status === 403) return logout();
                const files = await res.json();
                renderFiles(files);
            } catch (e) {
                console.error("Failed to fetch files", e);
            }
        }

        // --- Rendering ---
        function renderNodes(nodes) {
            const container = document.getElementById('nodes-container');
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted);">No nodes registered.</div>';
                return;
            }

            container.innerHTML = nodes.map(node => {
                const total = node.diskUsedBytes + node.diskFreeBytes;
                const percent = total > 0 ? ((node.diskUsedBytes / total) * 100).toFixed(1) : 0;
                const isAlive = node.status.toLowerCase() === 'alive';
                
                return `
                    <div class="node-card">
                        <div class="node-header">
                            <strong><i class="fa-solid fa-hard-drive"></i> ${node.nodeId}</strong>
                            <div class="status-badge ${isAlive ? 'alive' : 'dead'}">
                                <div class="pulse-dot"></div> ${node.status}
                            </div>
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                            <i class="fa-solid fa-link"></i> ${node.host}:${node.port}
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">
                            Disk Usage: ${percent}%
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                        </div>
                        ${isAlive ? `
                            <button class="btn btn-danger" style="padding: 0.4rem; font-size: 0.8rem; margin-top: 1rem;" onclick="failNode('${node.nodeId}')">
                                <i class="fa-solid fa-power-off"></i> Kill Node
                            </button>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderFiles(files) {
            const container = document.getElementById('files-container');
            if (!files || files.length === 0) {
                container.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No files found.</td></tr>';
                return;
            }

            container.innerHTML = files.map(file => {
                const isComplete = file.status.toLowerCase() === 'complete';
                const sizeKB = (file.fileSize / 1024).toFixed(1);
                
                return `
                    <tr>
                        <td><strong>${file.fileName}</strong></td>
                        <td>${sizeKB} KB</td>
                        <td>${file.totalChunks}</td>
                        <td><span class="file-status ${isComplete ? 'complete' : 'pending'}">${file.status}</span></td>
                        <td>
                            <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto;" 
                                    onclick="downloadFile('${file.fileId}', '${file.fileName}')" 
                                    ${!isComplete ? 'disabled' : ''}>
                                <i class="fa-solid fa-download"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- Actions ---
        async function failNode(nodeId) {
            try {
                const res = await fetch(`/nodes/${nodeId}/fail`, { 
                    method: 'POST', 
                    headers: getAuthHeaders() 
                });
                if (res.ok) {
                    showToast(`Simulated failure for ${nodeId}`, "success");
                    fetchNodes();
                } else {
                    showToast("Failed to kill node", "error");
                }
            } catch (e) {
                showToast("Network error", "error");
            }
        }

        async function downloadFile(fileId, filename) {
            showToast(`Starting download for ${filename}...`, "success");
            try {
                const res = await fetch(`/files/download?identifier=${fileId}`, {
                    headers: getAuthHeaders()
                });
                if (!res.ok) throw new Error("Download failed");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                showToast(e.message, "error");
            }
        }

        // --- Upload Logic ---
        const dropzone = document.getElementById('dropzone');
        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
        dropzone.ondragleave = () => { dropzone.classList.remove('dragover'); };
        dropzone.ondrop = (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) processUpload(e.dataTransfer.files[0]);
        };

        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                processUpload(e.target.files[0]);
                e.target.value = ''; // Reset input
            }
        }

        async function processUpload(file) {
            const fileId = "file-" + Math.random().toString(36).substr(2, 9);
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            
            document.getElementById('upload-progress-container').style.display = 'block';
            document.getElementById('upload-filename').innerText = file.name;
            const fill = document.getElementById('upload-fill');
            const percentTxt = document.getElementById('upload-percent');

            fill.style.width = '0%';
            percentTxt.innerText = '0%';

            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);

                const formData = new FormData();
                formData.append("file", chunk, file.name);
                formData.append("chunkNumber", i);
                formData.append("totalChunks", totalChunks);
                formData.append("identifier", fileId);

                try {
                    const res = await fetch('/files/chunks', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getToken()}` }, // No Content-Type for FormData
                        body: formData
                    });

                    if (!res.ok) {
                        const errMsg = await res.text();
                        throw new Error(errMsg || `Chunk ${i} failed`);
                    }

                    const percent = Math.round(((i + 1) / totalChunks) * 100);
                    fill.style.width = percent + '%';
                    percentTxt.innerText = percent + '%';
                } catch (e) {
                    showToast(`Upload failed: ${e.message}`, "error");
                    document.getElementById('upload-progress-container').style.display = 'none';
                    return;
                }
            }

            showToast("Upload completed!", "success");
            setTimeout(() => {
                document.getElementById('upload-progress-container').style.display = 'none';
            }, 2000);
            fetchData();
        }

        // --- Toasts ---
        function showToast(msg, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${msg}`;
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3s
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

    </script>
</body>
</html>
