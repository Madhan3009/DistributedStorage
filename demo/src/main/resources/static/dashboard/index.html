<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Storage Admin Dashboard</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
        }

        header {
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo i {
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: border-box;
            -webkit-text-fill-color: var(--bg-color);
            padding: 0.4rem;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            box-shadow: none;
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger);
            box-shadow: 0 4px 12px var(--danger-glow);
        }

        .btn-danger:hover {
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 1024px) {
            main {
                grid-template-columns: 3fr 1fr;
            }
            .full-width-col {
                grid-column: span 2;
            }
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Auth Form Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(7, 10, 19, 0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .auth-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .auth-card h2 {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .auth-toggle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-toggle span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        /* Node Health Panel */
        .node-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .node-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            transition: all 0.2s ease;
        }

        .node-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .node-name {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .status-badge.alive {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .status-badge.alive::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        .status-badge.dead {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .status-badge.dead::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--danger);
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .node-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.25rem;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            border-radius: 4px;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Upload panel */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.01);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.02);
        }

        .upload-zone i {
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            transition: color 0.2s ease;
        }

        .upload-zone:hover i {
            color: var(--primary);
        }

        .upload-progress {
            margin-top: 1rem;
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Files Table */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .file-status {
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .file-status.complete {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .file-status.pending {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        /* Notifications */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 1100;
        }

        .toast {
            background: rgba(22, 28, 45, 0.95);
            border: 1px solid var(--border-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--danger);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-server"></i>
            <span>D-Store Console</span>
        </div>
        <div class="user-info">
            <span id="current-user" style="font-weight: 500; font-size: 0.9rem;"></span>
            <button class="btn btn-secondary" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
        </div>
    </header>

    <main>
        <!-- Topology Section -->
        <section class="dashboard-card full-width-col">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-network-wired" style="color: var(--primary);"></i>
                    <span>Cluster Topology & Node Registry</span>
                </div>
                <button class="btn btn-secondary" onclick="fetchTopology()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
            </div>
            <div class="node-grid" id="nodes-container">
                <!-- Loaded dynamically -->
            </div>
        </section>

        <!-- Files Section -->
        <section class="dashboard-card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-file-shield" style="color: var(--success);"></i>
                    <span>Storage Index</span>
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Filename</th>
                            <th>Size</th>
                            <th>Chunks</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="files-container">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Actions Section -->
        <section class="dashboard-card">
            <div class="card-header">
                <div class="card-title">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: var(--primary);"></i>
                    <span>Distribute New File</span>
                </div>
            </div>
            <div class="upload-zone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-file-import"></i>
                <p style="font-weight: 600; font-size: 0.95rem;">Drag & Drop or click to select</p>
                <p style="font-size: 0.75rem; color: var(--text-muted);">Slices file into chunks and replicates to cluster</p>
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
            </div>
            <div class="upload-progress" id="upload-progress-wrapper">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                    <span id="upload-filename">Uploading...</span>
                    <span id="upload-percent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="upload-progressbar"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Auth Modal -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2 id="auth-title">Console Login</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" required placeholder="admin">
                </div>
                <div class="form-group" id="email-group" style="margin-bottom: 1rem; display: none;">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@dstore.com">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 0.75rem;" id="auth-submit-btn">Login</button>
            </form>
            <div class="auth-toggle">
                <span id="auth-toggle-text" onclick="toggleAuthMode()">Create account</span>
            </div>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        let token = localStorage.getItem('jwt_token');
        let username = localStorage.getItem('username');
        let isRegisterMode = false;
        const CHUNK_SIZE = 1024 * 50; // 50 KB chunks

        window.onload = () => {
            checkAuth();
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="${type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation'}" 
                   style="color: ${type === 'success' ? 'var(--success)' : 'var(--danger)'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function checkAuth() {
            if (!token) {
                document.getElementById('authOverlay').classList.add('active');
            } else {
                document.getElementById('authOverlay').classList.remove('active');
                document.getElementById('current-user').innerText = `Active Session: ${username}`;
                fetchTopology();
                fetchFiles();
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('auth-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const toggleText = document.getElementById('auth-toggle-text');
            const emailGroup = document.getElementById('email-group');

            if (isRegisterMode) {
                title.innerText = "Create Console Account";
                submitBtn.innerText = "Sign Up";
                toggleText.innerText = "Already have an account? Login";
                emailGroup.style.display = "flex";
                document.getElementById('email').required = true;
            } else {
                title.innerText = "Console Login";
                submitBtn.innerText = "Login";
                toggleText.innerText = "Create account";
                emailGroup.style.display = "none";
                document.getElementById('email').required = false;
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            const url = isRegisterMode ? '/auth/register' : '/auth/login';
            const payload = isRegisterMode 
                ? { username: user, password: pass, email: email }
                : { username: user, password: pass };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(isRegisterMode ? "Registration failed" : "Invalid credentials");
                }

                if (isRegisterMode) {
                    showToast("Account created successfully! Logging in...");
                    isRegisterMode = false;
                    toggleAuthMode();
                    document.getElementById('password').value = '';
                    return;
                }

                const data = await response.json();
                token = data.token;
                username = data.username;
                localStorage.setItem('jwt_token', token);
                localStorage.setItem('username', username);
                checkAuth();
                showToast("Welcome back, " + username);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('username');
            token = null;
            username = null;
            checkAuth();
            showToast("Logged out successfully");
        }

        async function fetchTopology() {
            try {
                const response = await fetch('/nodes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }
                const nodes = await response.json();
                renderTopology(nodes);
            } catch (err) {
                showToast("Failed to fetch topology", 'error');
            }
        }

        function renderTopology(nodes) {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';
            if (nodes.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">No nodes registered in cluster yet.</p>`;
                return;
            }

            nodes.forEach(node => {
                const totalDisk = node.diskUsedBytes + node.diskFreeBytes;
                const percentDisk = totalDisk > 0 ? ((node.diskUsedBytes / totalDisk) * 100).toFixed(1) : 0;
                const aliveClass = node.status.toLowerCase() === 'alive' ? 'alive' : 'dead';

                const card = document.createElement('div');
                card.className = 'node-card';
                card.innerHTML = `
                    <div class="node-header">
                        <div class="node-name">
                            <i class="fa-solid fa-hard-drive" style="color: ${node.status.toLowerCase() === 'alive' ? 'var(--primary)' : 'var(--text-muted)'};"></i>
                            <span>${node.nodeId}</span>
                        </div>
                        <span class="status-badge ${aliveClass}">${node.status}</span>
                    </div>
                    <div class="node-details">
                        <div><i class="fa-solid fa-network-wired"></i> Endpoint: ${node.host}:${node.port}</div>
                        <div><i class="fa-solid fa-clock"></i> Heartbeat: ${new Date(node.lastHeartbeatAt).toLocaleTimeString()}</div>
                        <div style="margin-top: 0.5rem; display: flex; justify-content: space-between;">
                            <span>Disk Usage</span>
                            <span>${percentDisk}%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: ${percentDisk}%;"></div>
                        </div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); text-align: right;">
                            ${(node.diskUsedBytes / (1024 * 1024)).toFixed(1)} MB / ${(totalDisk / (1024 * 1024)).toFixed(1)} MB
                        </div>
                    </div>
                    ${node.status.toLowerCase() === 'alive' ? `
                        <button class="btn btn-danger btn-secondary" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;" onclick="failNode('${node.nodeId}')">
                            <i class="fa-solid fa-power-off"></i> Kill Node
                        </button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        async function failNode(nodeId) {
            try {
                const response = await fetch(`/nodes/${nodeId}/fail`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    showToast(`Simulated failure event on node: ${nodeId}`);
                    fetchTopology();
                } else {
                    throw new Error("Failed to fail node");
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function fetchFiles() {
            try {
                const response = await fetch('/files', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const files = await response.json();
                renderFiles(files);
            } catch (err) {
                showToast("Failed to fetch storage index", 'error');
            }
        }

        function renderFiles(files) {
            const container = document.getElementById('files-container');
            container.innerHTML = '';
            if (files.length === 0) {
                container.innerHTML = `<tr><td colspan="5" style="color: var(--text-muted); text-align: center;">No files uploaded yet.</td></tr>`;
                return;
            }

            files.forEach(file => {
                const statusClass = file.status.toLowerCase() === 'complete' ? 'complete' : 'pending';
                const formattedSize = (file.fileSize / 1024).toFixed(2) + " KB";
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 500;">${file.fileName}</td>
                    <td>${formattedSize}</td>
                    <td>${file.totalChunks}</td>
                    <td><span class="file-status ${statusClass}">${file.status}</span></td>
                    <td>
                        <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" 
                                onclick="downloadFile('${file.fileId}', '${file.fileName}')"
                                ${file.status.toLowerCase() !== 'complete' ? 'disabled' : ''}>
                            <i class="fa-solid fa-download"></i> Retrieve
                        </button>
                    </td>
                `;
                container.appendChild(row);
            });
        }

        async function downloadFile(fileId, filename) {
            try {
                showToast(`Retrieving chunks for ${filename}...`);
                const response = await fetch(`/files/download?identifier=${fileId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error("Retrieval failed");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                showToast("File reassembled and downloaded successfully");
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Chunked Upload Client Logic
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                uploadFileInChunks(file);
            }
        }

        // Drag & Drop
        const dropzone = document.getElementById('dropzone');
        dropzone.ondragover = (e) => { e.preventDefault(); return false; };
        dropzone.ondrop = (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) uploadFileInChunks(file);
        };

        async function uploadFileInChunks(file) {
            const fileId = "file-" + Math.random().toString(36).substr(2, 9);
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            
            document.getElementById('upload-filename').innerText = file.name;
            const progressWrapper = document.getElementById('upload-progress-wrapper');
            const progressBar = document.getElementById('upload-progressbar');
            const percentLabel = document.getElementById('upload-percent');
            
            progressWrapper.style.display = 'flex';
            progressBar.style.width = '0%';
            percentLabel.innerText = '0%';

            for (let chunkNumber = 0; chunkNumber < totalChunks; chunkNumber++) {
                const start = chunkNumber * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunkBlob = file.slice(start, end);

                const formData = new FormData();
                formData.append("file", chunkBlob, file.name);
                formData.append("chunkNumber", chunkNumber);
                formData.append("totalChunks", totalChunks);
                formData.append("identifier", fileId);

                try {
                    const response = await fetch('/files/chunks', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Upload failed at chunk ${chunkNumber + 1}`);
                    }

                    const percent = Math.round(((chunkNumber + 1) / totalChunks) * 100);
                    progressBar.style.width = `${percent}%`;
                    percentLabel.innerText = `${percent}%`;
                } catch (err) {
                    showToast(err.message, 'error');
                    progressWrapper.style.display = 'none';
                    return;
                }
            }

            showToast(`Upload complete: ${file.name}`);
            setTimeout(() => {
                progressWrapper.style.display = 'none';
            }, 1000);
            fetchFiles();
            fetchTopology();
        }
    </script>
</body>
</html>
